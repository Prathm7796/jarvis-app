<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04121c;--panel:#08202f;--line:#1b5a73;--cyan:#3de0ff;--amber:#ffb347;--text:#d4f3ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 0%,#0a2c40,var(--bg) 60%);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;font-size:18px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.core{width:46px;height:46px;border-radius:50%;border:2px solid var(--cyan);position:relative;box-shadow:0 0 16px var(--cyan),inset 0 0 12px var(--cyan);animation:spin 8s linear infinite;border-top-color:var(--amber)}
.core::after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:26px;letter-spacing:.12em;font-weight:700}
#status{font-size:15px;color:var(--cyan);opacity:.8}
#log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border:1px solid var(--line);background:var(--panel);line-height:1.35;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.jarvis{align-self:flex-start;border-color:var(--cyan)}
.you{align-self:flex-end;border-color:var(--amber);color:#ffe6c2}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;font:inherit;font-size:18px;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--amber)}
button{background:var(--panel);color:var(--cyan);border:1px solid var(--cyan);padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
button.live{background:var(--amber);color:#04121c;border-color:var(--amber)}
@media (prefers-reduced-motion:reduce){.core{animation:none}}
</style>
</head>
<body>
<header>
  <div class="core"></div>
  <div><h1>JARVIS</h1><div id="status">Online</div></div>
</header>
<div id="log"></div>
<form id="f">
  <button type="button" id="mic" aria-label="Speak">Mic</button>
  <input id="t" placeholder="Ask Jarvis" autocomplete="off">
  <button type="submit">Send</button>
</form>
<script>
const CAT_DATE = new Date("2026-11-29T00:00:00");
const log = document.getElementById("log");
const input = document.getElementById("t");
const statusEl = document.getElementById("status");

function add(text, who){
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function speak(text){
  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }catch(e){}
}

function reply(q){
  const s = q.toLowerCase();
  if(/\b(hi|hello|hey)\b/.test(s)) return "Hello Prathm. How can I help?";
  if(s.includes("time")) return "It is " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) + ".";
  if(s.includes("date")||s.includes("day")) return "Today is " + new Date().toLocaleDateString([], {weekday:"long", day:"numeric", month:"long", year:"numeric"}) + ".";
  if(s.includes("cat")){
    const days = Math.ceil((CAT_DATE - new Date())/86400000);
    return days > 0 ? days + " days left until CAT on 29 November 2026." : "CAT day has arrived. Good luck!";
  }
  return "I can't answer that yet. Try asking for the time, the date, or the CAT countdown.";
}

function ask(q){
  q = q.trim();
  if(!q) return;
  add(q, "you");
  const a = reply(q);
  add(a, "jarvis");
  speak(a);
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  ask(input.value);
  input.value = "";
});

const mic = document.getElementById("mic");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){
  mic.disabled = true;
  mic.title = "Voice input is not supported in this browser";
}else{
  const rec = new SR();
  rec.lang = "en-IN";
  rec.onstart = () => { mic.classList.add("live"); statusEl.textContent = "Listening"; };
  rec.onend = () => { mic.classList.remove("live"); statusEl.textContent = "Online"; };
  rec.onerror = () => { add("I couldn't hear you. Check microphone permission and try again.", "jarvis"); };
  rec.onresult = e => ask(e.results[0][0].transcript);
  mic.addEventListener("click", () => { try{ rec.start(); }catch(e){} });
}

add("Jarvis online. Ask me the time, the date, or the CAT countdown.", "jarvis");
</script>
</body>
</html>
